# WP9 fine-tuning settings (handbook WP9, processing steps 1 to 6). Owner: Person C.
# The base model name is read from the top-level config.yaml (classifier.base_model) so WP2 and WP9 cannot drift.

seed: 42

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: all-linear
  task_type: CAUSAL_LM

sft:
  num_train_epochs: 3
  # Effective batch 8, as the handbook's 4 x 2. Split 2 x 4 because each record is ~1,500 tokens
  # (the label guide alone is 1,430), so a batch of 4 at that length does not fit a 10 to 16 GB card.
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.05
  # Measured on D1 train with the Qwen tokenizer: prompt + completion is 1,496 to 1,681 tokens.
  # The handbook's 512 predates the label guide and truncates away every completion.
  max_length: 2048
  gradient_checkpointing: true
  gradient_checkpointing_kwargs: {use_reentrant: false}
  fp16: true            # the Kaggle T4 has no bf16; train.py --bf16 switches this for an Ampere GPU
  eval_strategy: steps
  eval_steps: 50
  save_steps: 50
  logging_steps: 10
  report_to: none

# Step 5: r x learning rate, four runs, chosen on validation joint exact match.
sweep:
  r: [8, 16]
  learning_rate: [1.0e-4, 2.0e-4]

# Step 6: retrain the chosen setting on these many records and plot validation accuracy against size.
learning_curve:
  sizes: [200, 400, 800, 1600]

# Step 8: GPU hours x this rate is the amortised training cost WP11 uses.
cost:
  t4_usd_per_hour: 0.35
