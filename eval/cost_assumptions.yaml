# Owner: Person E (WP11). Business assumptions for the cost model, and nothing else.
# All prices (models, Mapbox, GraphHopper) live in config.yaml under `prices:` (WP0) and are read from there.
# Values from the cost model proposal (Nov 14), with no objections from the team. null = not decided yet. The cost model prints every null, so nothing is silently counted as zero.

volumes: [1000, 100000, 1000000]     # requests per month (WP11 Part C step 3)
days_per_month: 30

# Which config.yaml Mapbox price each logged api_calls name uses.
api_to_price:
  directions: directions
  geocoding: temporary_geocoding
  searchbox: search_box_requests             # [check that /forward is billed per request, not per session]
  searchbox_category: search_box_requests

eur_to_usd: 1.10                             # GraphHopper is priced in EUR. EUR/USD mid 1.1046 on Nov 13, 2026; refresh on the day of the final run

fixed_monthly_usd:
  app_hosting: 30                            # one small server, ~t3.medium on-demand ($0.0416/h); range 0 to 50
  classifier_hosting: 30                     # CPU instance, same size as above [WP9: confirm it runs on CPU]; GPU would cost far more
  training_one_off: 0                        # WP9: about 45 min on Kaggle's free GPU, no cost (Rishi, Nov 18)
  amortise_months: 12                        # [team to agree]

error_cost_usd:                              # cost per error, multiplied by the measured rate (Part C step 5)
  wrong_met_claim: 5                         # lost user plus a bad trip; range 4 to 10
  wrongful_refusal: 4                        # value of a lost user: travel app cost per install, US $1.50 to $7
  missed_safety_handoff: 100                 # highest on purpose; range 50 to 500
  unsupported_claim: 4                       # e.g. user arrives somewhere closed; range 1.50 to 7
  sponsor_rule_broken: 25                    # well above revenue per card; range 10 to 50

status_quo:                                  # Part C step 6. Main number is minutes saved (Nov 12 meeting);
  value_of_time_usd_per_hour: null           # optional: only set if the team wants a dollar figure too

revenue:
  cards_per_accepted_route: 0.6              # fallback only: cost_model uses the share measured in the run when request lines exist. At most 1 (P-05)
  usd_per_card: 0.05                         # per card shown: CPC x click rate ($1.75 x 3%); range 0.02 to 0.14
