name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Test
        run: uv run pytest
        env:
          FIXTURES: replay
