[project]
name = "routechat"
version = "0.1.0"
description = "Conversational route planner: natural-language trip requests, a fine-tuned classifier, GraphHopper and Mapbox routing, and verified constraints."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic",
    "langgraph",
    "langchain-openai",
    "httpx",
    "tenacity",
    "python-dotenv",
    "pyyaml",
    "orjson",
    "langdetect",
    "streamlit",
    "pydeck",
]

[dependency-groups]
finetune = [
    "torch",
    "transformers",
    "peft",
    "trl",
    "datasets",
]
dev = [
    "pytest",
    "pandas",
    "scikit-learn",
    "matplotlib",
    "faker",
    "openai",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["routechat"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
